spring.application.name=task-manager
server.port=8080

# Banco H2 em arquivo (dados persistem entre execuções).
# AUTO_SERVER abre um mini servidor TCP: permite acessar o mesmo banco por
# outra JVM (console H2, IDE) sem gerar "Database may be already in use".
spring.datasource.url=jdbc:h2:file:./data/taskdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jackson.serialization.write-dates-as-timestamps=false